name: snakemake_env
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9
  - snakemake>=7.32.0
  - snakemake-minimal>=7.32.0
  - graphviz  # For workflow visualization
  - pip
  - pip:
    - openpyxl>=3.1.2
    - numpy>=1.26.0
    - seaborn
    - gseapy>=1.1.3
    - mygene>=3.2.2
    - pandas>=2.1.0
    - pyyaml>=6.0.1
    - matplotlib>=3.8.0
    - goatools>=1.4.12
    - git+https://github.com/parkgilbong/YG_utils_analysis.git@main
