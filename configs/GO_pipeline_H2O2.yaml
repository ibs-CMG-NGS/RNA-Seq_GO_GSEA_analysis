# ============================================================
# GO Analysis Pipeline Configuration
# ============================================================
# This config contains ONLY analysis parameters for the main
# Snakemake GO enrichment pipeline.
# File paths are managed by Snakemake rules.
#
# For additional standalone analyses, see:
#   - configs/deg_comparison_H2O2.yaml  (DEG comparison)
#   - configs/gene_filter_H2O2.yaml     (Gene filter analysis)
# ============================================================

# Output directory - Snakemake will create intermediate files here
ROOT_DIR: "data/processed/H2O2"

# ============================================================
# Data Loading
# ============================================================
data_loading:
  # Input data source
  excel_path: "data/processed/H2O2/Acute_3D_Genename.xlsx"
  sheets: "Acute_3D_Genename" # or "all"
  
  # Column mapping from Excel to standardized format
  gene_col: "external_gene_name"
  log2fc_col: "log2.FC."
  padj_col: "P.adj"

# ============================================================
# DEG Filtering
# ============================================================
filtering:
  mode: thresholds  # thresholds | gene_list
  padj_cutoff: 0.01
  log2fc_cutoff: 0.5  # if 0, no log2FC filtering
  direction: both   # up | down | both
  # For gene_list mode: gene_list_file: "configs/genes_of_interest.txt"

# ============================================================
# Volcano Plot
# ============================================================
volcano:
  padj_cutoff: 0.01
  log2fc_cutoff: 0 # if 0, no log2FC cutoff line
  xlim: 
  ylim: 
  # annotate_file: genes_of_interest.txt
  max_labels: 30

# ============================================================
# GO Enrichment Analysis
# ============================================================
go_enrich:
  # Reference files (project-level resources)
  obo: "ref/go-basic.obo"
  gaf: "ref/goa_mouse.gaf"
  
  # Analysis parameters
  taxon: 10090 # Mouse (Mus musculus). For human use 9606
  alpha: 0.05
  mt: "fdr_bh"  # Multiple testing correction method

# ============================================================
# GO Barplot Visualization
# ============================================================
go_barplot:
  top_n: 10
  namespaces: ["BP", "MF", "CC"]  # or "ALL"

# ============================================================
# Report Generation
# ============================================================
report:
  title: "GO Analysis Report"
  sample_name: "Acute_H2O2_3D"
  author: "YGKim"

