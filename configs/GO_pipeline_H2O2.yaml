# Single YAML with per-step sections (edit paths as needed)
ROOT_DIR: "data/processed/H2O2" # This will be the default output directory

data_loading:
  excel_path: "data/processed/H2O2/Acute_3D_Genename.xlsx"
  sheets: "Acute_3D_Genename" # or "all"
  gene_col: "external_gene_name"
  log2fc_col: "log2.FC."
  padj_col: "P.adj"
  csv_file: "standardized.csv"

filtering:
  in_csv_file: "standardized.csv"
  mode: thresholds  # thresholds | gene_list
  padj_cutoff: 0.01
  log2fc_cutoff: 0.5  # if 0, no log2FC filtering
  direction: both   # up | down | both
  # gene_list_file: "genes_of_interest.txt"
  out_csv_file: "filtered.csv"
  out_up_genes_file: "filtered_up_genes.txt"
  out_down_genes_file: "filtered_down_genes.txt"

volcano:
  in_csv_file: "standardized.csv"
  out_png_file: "volcano.png"
  padj_cutoff: 0.01
  log2fc_cutoff: 0 # if 0, no log2FC cutoff line
  xlim: 
  ylim: 
  # annotate_file: genes_of_interest.txt
  max_labels: 30

go_enrich:
  # EITHER provide genes_file OR filtered_csv
  # genes_file: configs/genes_of_interest.txt
  filtered_csv: "filtered.csv" # For combined analysis
  up_genes_file: "filtered_up_genes.txt"
  down_genes_file: "filtered_down_genes.txt"
  # (REQUIRED) Path to the background gene list file.
  # This should be a CSV file with a "gene" column containing all genes
  # expressed in the experiment, typically the output of the data_loading step.
  background_csv: "standardized.csv"
  obo: "ref/go-basic.obo"
  gaf: "ref/goa_mouse.gaf"
  gaf_file: "ref/goa_mouse.gaf"
  taxon: 10090 # Add this line for mouse (Mus musculus) for human use 9606
  alpha: 0.05
  goea_csv_file: "goea_results_all.csv"
  goea_up_csv_file: "goea_results_up.csv"
  goea_down_csv_file: "goea_results_down.csv"

go_barplot:
  out_png_file: "go_barplot_all.png"
  out_up_png_file: "go_barplot_up.png"
  out_down_png_file: "go_barplot_down.png"
  top_n: 10
  namespaces: ["BP", "MF", "CC"]  # or "ALL"

report:
  standardized_csv_file: "standardized.csv"
  filtered_csv_file: "filtered.csv"
  volcano_png_file: "volcano.png"
  goea_csv_file: "goea_results_all.csv" # Optional input
  go_barplot_png_file: "go_barplot_all.png"
  goea_up_csv_file: "goea_results_up.csv"
  go_up_barplot_png_file: "go_barplot_up.png"
  goea_down_csv_file: "goea_results_down.csv"
  go_down_barplot_png_file: "go_barplot_down.png"
  out_html_file: "report.html"
  title: "GO Analysis Report"
  sample_name: "Acute_H2O2_3D"
  author: "YGKim"

deg_comparison:
  # 비교할 두 개의 DEG 결과 파일을 지정합니다.
  # 예시: file1: "filtered_KD_vs_Scr.csv", file2: "filtered_OE_vs_Scr.csv"
  file1: "filtered_1d.csv" # 첫 번째 파일 경로 (예시)
  file2: "filtered_3d.csv" # 두 번째 파일 경로 (예시)
  name1: "Acute_1D" # 첫 번째 데이터셋 이름
  name2: "Acute_3D" # 두 번째 데이터셋 이름

  # --- Visualization Options ---
  # Heatmap: 겹치는 유전자 중 log2FC가 가장 큰 N개(up)와 가장 작은 N개(down)를 각각 표시
  heatmap_top_n: 10
  heatmap_cmap: "bwr" # 추천: "coolwarm", "bwr", "viridis"
  heatmap_annot_kws: { "size": 12 } # Heatmap 내부 글자 크기 조절

  # Venn Diagram: 색상과 투명도 조절
  venn_colors: ["#007acc", "#e85f02"]
  venn_alpha: 0.5

  out_venn_png: "comparison_DEGs_venn.png"
  out_heatmap_png: "comparison_DEGsheatmap.png"

gene_filter:
  # 원본 데이터(Excel)가 있는 폴더 경로
  # 비교할 표준화된 CSV 파일 목록
  in_csv_files:
    - "standardized_1d.csv"
    - "standardized_3d.csv"
  file_aliases: ["Acute_1D", "Acute_3D"] # 각 파일에 대한 별칭 (그래프 축 이름으로 사용)

  # 분석 결과가 저장될 출력 폴더 경로
  output_dir: "output/gene_filter_analysis" # ROOT_DIR 기준 상대 경로

  # 분석 대상 유전자 목록 파일
  gene_list_file: "configs/genes_of_interest.txt" # 프로젝트 루트 기준 경로로 수정

  # 컬럼 이름 매핑
  column_map:
    gene: "gene"
    log2fc: "log2fc"
    padj: "padj"

  # Dot plot 시각화 옵션
  plot_options:
    # 그림 크기 (너비, 높이)
    figure_size: [5, 8] # 너비를 높이보다 작거나 비슷하게 설정 (예: [5, 8])

    # X축 제목 (비워두면 기본값 'source_sheet' 사용)
    xaxis_title: "Experimental Conditions"

    # X축 눈금 이름 매핑 (비워두면 원본 시트 이름 사용)
    xaxis_tick_map:
      Acute_1D_Genename: "Acute 1D"
      Acute_3D_Genename: "Acute 3D"

    # Log2FC 색상 범위 (최소, 최대)
    color_norm: [-2, 2]

    # P-value에 따른 점 크기 매핑
    size_map:
      'p < 0.01': 200
      'p < 0.05': 100
      'p > 0.05': 20

    # Dot outline options
    dot_outline_color: "gray" # Set to null or "" for no outline
    dot_outline_width: 0.5

    # Colorbar options
    colorbar_width: 0.05  # Relative width of the colorbar
    colorbar_height_ratio: 0.15 # Relative height of the colorbar compared to the main plot
    colorbar_x_offset: 0.1 # X-offset from the right edge of the main plot for legend/colorbar
    colorbar_y_offset: 0.05 # Y-offset from the bottom of the size legend for the colorbar
    colorbar_ticks: [-2, 0, 2] # Specific tick values for the colorbar
    # colorbar_ticklabels: ["Low", "Mid", "High"] # Specific tick labels for the colorbar
