# ============================================================
# GO Analysis Pipeline Configuration
# ============================================================
# This config contains ONLY analysis parameters for the main
# Snakemake GO enrichment pipeline.
# File paths are managed by Snakemake rules.
#
# For additional standalone analyses, see:
#   - configs/deg_comparison_*.yaml  (DEG comparison)
#   - configs/gene_filter_*.yaml     (Gene filter analysis)
# ============================================================

# Output directory - Snakemake will create intermediate files here
ROOT_DIR: "output/go_analysis_results"

# ============================================================
# Data Loading
# ============================================================
data_loading:
  # Input data source
  excel_path: "data/processed/H2O2/Acute_1D_Genename.xlsx"
  sheets: "PFC_Male" # or "all"
  
  # Column mapping from Excel to standardized format
  gene_col: "HGNC symbol"
  log2fc_col: "log2FC"
  padj_col: "adjusted p-value"

# ============================================================
# DEG Filtering
# ============================================================
filtering:
  mode: thresholds  # thresholds | gene_list
  padj_cutoff: 0.05
  log2fc_cutoff: 0
  direction: both   # up | down | both
  # For gene_list mode: gene_list_file: "configs/genes_of_interest.txt"

# ============================================================
# Volcano Plot
# ============================================================
volcano:
  padj_cutoff: 0.05
  log2fc_cutoff: 0
  xlim: [-3.1, 3.1]
  ylim: [-0.5, 10.5]
  # annotate_file: configs/genes_of_interest.txt
  max_labels: 30

# ============================================================
# GO Enrichment Analysis
# ============================================================
go_enrich:
  # Reference files (project-level resources)
  obo: "ref/go-basic.obo"
  gaf: "ref/goa_human.gaf"
  
  # Analysis parameters
  taxon: 9606 # Human (Homo sapiens). For mouse use 10090
  alpha: 0.05
  mt: "fdr_bh"  # Multiple testing correction method

# ============================================================
# GO Barplot Visualization
# ============================================================
go_barplot:
  top_n: 10
  namespaces: ["BP", "MF", "CC"]  # or "ALL"

# ============================================================
# Report Generation
# ============================================================
report:
  title: "GO Analysis Report"
  sample_name: "CHD8_PFC_Male"
  author: "YGKim"
