# ============================================================
# GO Analysis Pipeline Configuration - Shank2 Project
# ============================================================
# Project-specific configuration for Shank2 3W-HT sample
#
# Usage:
#   cd /path/to/RNA-Seq_GO_GSEA_analysis  # Must be in PROJECT ROOT
#   snakemake --snakefile workflow/Snakefile_GO \
#             --configfile configs/GO_pipeline_Shank2.yaml \
#             --cores 4 --use-conda
#
# This config extends workflow/config/go_config.yaml
# All paths are relative to project root
# ============================================================

# Output directory - Results will be saved here
ROOT_DIR: "output/Shank2_3WHT"

# ============================================================
# Data Loading
# ============================================================
data_loading:
  # Input data source
  excel_path: "data/Shank2_RNA-seq_result.xlsx"
  sheets: "3W-HT" # or "all"
  
  # Column mapping from Excel to standardized format
  gene_col: "Mouse symbol"
  log2fc_col: "log2FC"
  padj_col: "adjusted p-value"
  
  # --- GSEA 파일 생성을 위한 섹션 (Optional) ---
  gsea_outputs:
    enabled: true # 이 기능을 사용할지 여부를 결정하는 마스터 스위치
    # 원본 데이터에서 각 그룹에 해당하는 샘플 컬럼들을 명시
    # 'HT'와 'WT'는 클래스(그룹) 이름이 됩니다.
    sample_columns:
      HT: ["HT1", "HT2", "HT3", "HT4", "HT5"]
      WT: ["WT1", "WT2", "WT3", "WT4", "WT5"]

# ============================================================
# DEG Filtering
# ============================================================
filtering:
  mode: thresholds  # thresholds | gene_list
  padj_cutoff: 0.05
  log2fc_cutoff: 0  # if 0, no log2FC filtering
  direction: both   # up | down | both
  # For gene_list mode: gene_list_file: "configs/genes_of_interest.txt"

# ============================================================
# Volcano Plot
# ============================================================
volcano:
  padj_cutoff: 0.05
  log2fc_cutoff: 0 # if 0, no log2FC cutoff line
  xlim: 
  ylim: 
  # annotate_file: genes_of_interest.txt
  max_labels: 30

# ============================================================
# GO Enrichment Analysis
# ============================================================
go_enrich:
  # Reference files (project-level resources)
  obo: "ref/go-basic.obo"
  gaf: "ref/goa_mouse.gaf"
  
  # Analysis parameters
  taxon: 10090 # Mouse (Mus musculus). For human use 9606
  alpha: 0.05
  mt: "fdr_bh"  # Multiple testing correction method

# ============================================================
# GO Barplot Visualization
# ============================================================
go_barplot:
  top_n: 10
  namespaces: ["BP", "MF", "CC"]  # or "ALL"

# ============================================================
# Report Generation
# ============================================================
report:
  title: "GO Analysis Report"
  sample_name: "Shank2_3W-HT"
  author: "YGKim"
