# ============================================================
# GO Analysis Pipeline - Configuration Template
# ============================================================
# This is a TEMPLATE file. DO NOT use this directly with Snakemake.
# 
# To create a new project config:
#   1. Copy this file to configs/ directory:
#      cp configs/templates/go_config.yaml configs/GO_pipeline_MyProject.yaml
#   
#   2. Edit the copied file and customize:
#      - ROOT_DIR: your output directory
#      - data_loading.excel_path: your data file
#      - data_loading.sheets: your sheet names
#      - report.sample_name: your sample name
#      - report.author: your name
#   
#   3. Run Snakemake with your config:
#      snakemake --snakefile Snakefile_GO \
#                --configfile configs/GO_pipeline_MyProject.yaml \
#                --cores 4 --use-conda
#
# All paths are relative to PROJECT ROOT
# ============================================================

# Output directory - Results will be saved here
ROOT_DIR: "output/my_analysis"

# ============================================================
# Data Loading
# ============================================================
data_loading:
  # Input data source
  # OVERRIDE THIS in your project-specific config with actual file path
  excel_path: "data/YOUR_DATA.xlsx"
  sheets: "all" # or "all" or comma-separated list: "Sheet1,Sheet2"
  
  # Column mapping from Excel to standardized format
  gene_col: "Mouse symbol"
  log2fc_col: "log2FC"
  padj_col: "adjusted p-value"
  
  # --- GSEA 파일 생성을 위한 섹션 (Optional) ---
  gsea_outputs:
    enabled: true # 이 기능을 사용할지 여부를 결정하는 마스터 스위치
    # 원본 데이터에서 각 그룹에 해당하는 샘플 컬럼들을 명시
    # 'HT'와 'WT'는 클래스(그룹) 이름이 됩니다.
    sample_columns:
      HT: ["HT1", "HT2", "HT3", "HT4", "HT5"]
      WT: ["WT1", "WT2", "WT3", "WT4", "WT5"]

# ============================================================
# DEG Filtering
# ============================================================
filtering:
  mode: thresholds  # thresholds | gene_list
  padj_cutoff: 0.05
  log2fc_cutoff: 0  # if 0, no log2FC filtering
  direction: both   # up | down | both
  # For gene_list mode: gene_list_file: "configs/genes_of_interest.txt"

# ============================================================
# Volcano Plot
# ============================================================
volcano:
  padj_cutoff: 0.05
  log2fc_cutoff: 0 # if 0, no log2FC cutoff line
  xlim: 
  ylim: 
  # annotate_file: genes_of_interest.txt
  max_labels: 30

# ============================================================
# GO Enrichment Analysis
# ============================================================
go_enrich:
  # Reference files (project-level resources)
  obo: "ref/go-basic.obo"
  gaf: "ref/goa_mouse.gaf"
  
  # Analysis parameters
  taxon: 10090 # Mouse (Mus musculus). For human use 9606
  alpha: 0.05
  mt: "fdr_bh"  # Multiple testing correction method

# ============================================================
# GO Barplot Visualization
# ============================================================
go_barplot:
  top_n: 10
  namespaces: ["BP", "MF", "CC"]  # or "ALL"

# ============================================================
# Report Generation
# ============================================================
report:
  title: "GO Analysis Report"
  sample_name: "Shank2_3W-HT"
  author: "YGKim"

