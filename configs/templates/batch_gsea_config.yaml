# Batch GSEA Analysis Configuration
# This file orchestrates a batch run of the GSEA pipeline for multiple samples using Snakemake.

# A root directory to store all outputs from this batch run.
# A subfolder will be created for each sample.
output_root: "results/batch_gsea_H2O2_GABA"

# =============================================================================
# List of samples to process. Each sample will run the full GSEA pipeline.
# =============================================================================
samples:
  - name: "H2O2-treated"
    # Overrides for this specific sample.
    # These will be merged with the base_config.
    overrides:
      data_loading:
        excel_path: "data/from_de_pipeline/H2O2_vs_Control_DE_results.xlsx"
        sheets: "DE_Results"
        # Classic GSEA 사용 - Excel 파일에 샘플별 expression 데이터 있음
        gsea_outputs:
          enabled: true
          expression_matrix_file: "gsea_expression_matrix.txt"
          class_labels_file: "gsea_class_labels.cls"
          sample_columns:
            H2O2: ["H2O2_3", "H2O2_6", "H2O2_7"]
            Ctrl: ["Ctrl_3", "Ctrl_4", "Ctrl_8"]

  - name: "GABA-treated"
    # Overrides for this specific sample.
    # These will be merged with the base_config.
    overrides:
      data_loading:
        excel_path: "data/from_de_pipeline/GABA_vs_Control_DE_results.xlsx"
        sheets: "DE_Results"
        # Classic GSEA 사용 - Excel 파일에 샘플별 expression 데이터 있음
        gsea_outputs:
          enabled: true
          expression_matrix_file: "gsea_expression_matrix.txt"
          class_labels_file: "gsea_class_labels.cls"
          sample_columns:
            GABA: ["GABA_5", "GABA_6", "GABA_8"]
            Ctrl: ["Ctrl_3", "Ctrl_4", "Ctrl_8"]

# =============================================================================
# Base configuration that applies to all samples
# Individual samples can override these settings
# =============================================================================
base_config:
  # =================================
  # Data Loading Settings (공통 설정)
  # =================================
  data_loading:
    # excel_path와 sheets는 각 샘플의 overrides에서 지정하세요
    # 여기서는 모든 샘플에 공통으로 적용되는 설정만 포함
    gene_col: "symbol"
    log2fc_col: "log2FoldChange"
    padj_col: "padj"
    csv_file: "standardized.csv"
    
    # --- Classic GSEA를 위한 파일 생성 설정 ---
    # Excel 파일에 샘플별 expression 데이터가 있으므로 Classic GSEA 사용 가능
    gsea_outputs:
      enabled: true  # ✅ 샘플 데이터 있으므로 true
      expression_matrix_file: "gsea_expression_matrix.txt"
      class_labels_file: "gsea_class_labels.cls"
      # sample_columns은 각 샘플의 overrides에서 지정
  
  # =================================
  # GSEA Analysis Settings
  # =================================
  gsea:
    # Analysis mode. Can be one of:
    #   - "prerank": Uses a pre-ranked gene list. Fast and flexible. (권장 for DE results)
    #   - "classic": Uses the full expression matrix and class labels.
    mode: classic
    
    # --- Settings for 'prerank' mode ---
    prerank_input_csv: "standardized.csv"
    rank_metric_column: "log2FoldChange"
    gene_symbol_column: "symbol"
    
    # --- Settings for 'classic' mode ---
    # Classic 모드 사용 시:
    # 1. 위의 data_loading.gsea_outputs.enabled를 true로 설정
    # 2. 아래 파일명은 data_loading.gsea_outputs에서 생성한 파일과 동일해야 함
    expression_matrix_csv: "gsea_expression_matrix.txt"  # data_loading에서 생성됨
    class_labels_file: "gsea_class_labels.cls"           # data_loading에서 생성됨
    
    # --- Common settings for both modes ---
    # --- 분석의 깊이를 조절하는 상세 파라미터 ---
    
    # 1. 유전자 세트 크기 필터링
    min_size: 15
    max_size: 500
    
    # 2. 통계적 신뢰도를 위한 순열 검정 횟수
    permutation_num: 5000  # 일반적으로 1000 이상 권장, 횟수가 높을수록 p-value 신뢰도는 상향되나 분석 속도는 길어짐
    
    # 3. Pre-ranked 분석의 가중치 (일반적으로 1 사용)
    weighting_exponent: 1  # p=1(기본값): 유전자의 순위 값 그대로 가중치를 부여
                           # p=0: 모든 유전자에 동일한 가중치 부여
                           # p=2 이상: 상위 유전자에 더 큰 가중치 부여
    
    # 4. 분석 재현성을 위한 랜덤 시드
    seed: 42  # 순열 검정은 무작위 과정이므로, 실행할 때마다 미세하게 결과가 달라질 수 있습니다.
              # seed 값을 특정 숫자로 고정하면, 언제 누가 실행하더라도 항상 동일한 결과를 얻을 수 있어
              # 분석의 재현성을 보장합니다.
    
    # Gene sets to analyze
    # This can be a library name from Enrichr (e.g., 'KEGG_2021_Mouse')
    # OR a path to your own custom gene set file in GMT format.
    gene_sets:
      - "KEGG_2021_Mouse"
      - "GO_Biological_Process_2023"
      - "GO_Molecular_Function_2023"
      - "GO_Cellular_Component_2023"
      - "MSigDB_Hallmark_2020"
      - "ref/mh.all.v2025.1.Mm.symbols.gmt"  # 사용자 정의 파일
      - "ref/m5.go.v2025.1.Mm.symbols.gmt"   # MSigDB GO gene sets
      # Example with more custom GMT files:
      # - "ref/my_custom_pathways.gmt"
    
    # Output directory for all GSEA results.
    gsea_output_dir: "gsea_results"
    
    # Output Excel file for GSEA results summary.
    output_excel_file: "GSEA_Report.xlsx"
  
  # =================================
  # GSEA Plotting Settings
  # =================================
  gsea_plot:
    # Input: The main excel file generated by the GSEA step.
    gsea_input_excel: "GSEA_Report.xlsx"
    
    # Output: A directory where GSEA plots will be saved.
    # This is typically a subdirectory within the main GSEA results folder.
    gsea_plot_output_dir: "plots"
    
    # The statistical significance threshold for filtering pathways.
    # Only pathways with an FDR q-value below this cutoff will be plotted.
    # Common values are 0.25 (standard for GSEA) or 0.05 (more stringent).
    fdr_cutoff: 0.25
    
    # The number of top enriched pathways to visualize in summary plots.
    top_n_plots: 15
    
    # A list of file formats for the generated plots (e.g., png, svg, pdf).
    plot_formats:
      - "png"
      - "svg"


