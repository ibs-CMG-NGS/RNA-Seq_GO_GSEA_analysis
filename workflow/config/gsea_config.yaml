# Single YAML with per-step sections (edit paths as needed)
ROOT_DIR: "data/processed/Shank2" # This will be the default output directory

# =================================
# Data Loading Settings
# =================================
data_loading:
  excel_path: "data/processed/Shank2/Shank2_RNA-seq_result.xlsx"
  sheets: "3W-HT" # or "all"
  gene_col: "Mouse symbol"
  log2fc_col: "log2FC"
  padj_col: "adjusted p-value"
  csv_file: "standardized.csv"
  # --- GSEA 파일 생성을 위한 섹션 ---
  gsea_outputs:
    enabled: true # 이 기능을 사용할지 여부를 결정하는 마스터 스위치
    expression_matrix_file: "gsea_expression_matrix.txt" # Classic GSEA용 Expression Matrix 파일 경로
    class_labels_file: "gsea_class_labels.cls" # Classic GSEA용 Class Labels (.cls) 파일 경로
    # 원본 데이터에서 각 그룹에 해당하는 샘플 컬럼들을 명시
    # 'HT'와 'WT'는 클래스(그룹) 이름이 됩니다.
    sample_columns:
      HT: ["HT1", "HT2", "HT3", "HT4", "HT5"]
      WT: ["WT1", "WT2", "WT3", "WT4", "WT5"]

# =================================
# GSEA Analysis Settings
# =================================
gsea:
  # Analysis mode. Can be one of:
  #   - "prerank": Uses a pre-ranked gene list. Fast and flexible.
  #   - "classic": Uses the full expression matrix and class labels.
  mode: "classic"

  # --- Settings for 'prerank' mode ---
  prerank_input_csv: "standardized.csv"
  rank_metric_column: "log2fc"
  gene_symbol_column: "gene"

  # --- Settings for 'classic' mode ---
  # Path to a CSV file with genes as the first column and samples as other columns.
  expression_matrix_csv: "gsea_expression_matrix.txt"
  # Path to a GSEA-compatible CLS file defining sample phenotypes.
  class_labels_file: "gsea_class_labels.cls"

  # --- Common settings for both modes ---
  # --- 분석의 깊이를 조절하는 상세 파라미터 ---
  # 1. 유전자 세트 크기 필터링
  min_size: 15
  max_size: 500

  # 2. 통계적 신뢰도를 위한 순열 검정 횟수
  permutation_num: 1000 # 일반적으로 1000 이상 권장, 횟수가 높을수록 p-value 신뢰도는 상향되나 분석 속도는 길어짐. 

  # 3. Pre-ranked 분석의 가중치 (일반적으로 1 사용)
  weighting_exponent: 1 # p=1(기본값): 유전자의 순위 값 그대로 가중치를 부여, p=0: 모든 유전자에 동일한 가중치 부여, p=2 이상: 상위 유전자에 더 큰 가중치 부여

  # 4. 분석 재현성을 위한 랜덤 시드
  seed: 42 # 순열 검정은 무작위 과정이므로, 실행할 때마다 미세하게 결과가 달라질 수 있습니다. seed 값을 특정 숫자로 고정하면, 언제 누가 실행하더라도 항상 동일한 결과를 얻을 수 있어 분석의 재현성을 보장합니다.

  # This can be a library name from Enrichr (e.g., 'KEGG_2021_Human')
  # OR a path to your own custom gene set file in GMT format.
  gene_sets:
    - "KEGG_2021_Human"
    - "GO_Biological_Process_2023"
    - "MSigDB_Hallmark_2020"
    - "ref/mh.all.v2025.1.Mm.symbols.gmt" # 사용자 정의 파일
    # Example with a custom GMT file:
    # gene_sets: "ref/my_custom_pathways.gmt"
  
  # Output directory for all GSEA results.
  gsea_output_dir: "gsea_results"

  # Output Excel file for GSEA results summary.
  output_excel_file: "GSEA_Report.xlsx"

# =================================
# GSEA Plotting Settings
# =================================
gsea_plot:
  # Input: The main excel file generated by the GSEA step.
  gsea_input_excel: "GSEA_Report.xlsx"
  # Output: A directory where GSEA plots will be saved.
  # This is typically a subdirectory within the main GSEA results folder.
  gsea_plot_output_dir: "plots"

  # The statistical significance threshold for filtering pathways.
  # Only pathways with an FDR q-value below this cutoff will be plotted.
  # Common values are 0.25 (standard for GSEA) or 0.05 (more stringent).
  fdr_cutoff: 0.25  

  # The number of top enriched pathways to visualize in summary plots.
  top_n_plots: 15

  # A list of file formats for the generated plots (e.g., png, svg, pdf).
  plot_formats:
    - "png"
    - "svg"
